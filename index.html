<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六年级数学 · 精准练习</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f0f4f8;color:#1f2937;max-width:860px;margin:0 auto;padding:14px 12px 60px;}
  h1{font-size:20px;margin:6px 0 2px;}
  .sub{font-size:12px;color:#8a94a6;margin-bottom:12px;}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  nav a{padding:8px 14px;border-radius:18px;background:#fff;border:1px solid #d8e0ea;font-size:13px;cursor:pointer;color:#4b5563;text-decoration:none;}
  nav a.on{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:700;}
  .page{display:none;} .page.on{display:block;}
  h2{font-size:16px;margin:6px 0 12px;padding-left:9px;border-left:4px solid #2563eb;}
  .card{background:#fff;border:1px solid #e3e9f0;border-radius:12px;padding:15px;margin-bottom:13px;}
  .unit{margin-bottom:12px;}
  .unit-h{font-size:14px;font-weight:700;color:#2563eb;margin-bottom:7px;}
  .pts{display:flex;flex-wrap:wrap;gap:7px;}
  .pt{padding:6px 12px;border-radius:16px;background:#f3f6fb;border:1px solid #dbe4ef;font-size:13px;cursor:pointer;}
  .pt.sel{background:#2563eb;color:#fff;border-color:#2563eb;}
  .pt .bar{display:inline-block;margin-left:5px;font-size:11px;color:#8a94a6;}
  .pt.sel .bar{color:#cfe0ff;}
  .btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:15px;font-weight:700;cursor:pointer;}
  .btn.gray{background:#6b7280;} .btn.green{background:#16a34a;}
  .q{margin-bottom:18px;padding-bottom:14px;border-bottom:1px dashed #e3e9f0;}
  .q .stem{font-size:16px;line-height:1.7;margin-bottom:10px;}
  .q .tag{display:inline-block;font-size:11px;color:#2563eb;margin-right:6px;font-weight:700;}
  .opt{padding:9px 12px;border:1px solid #d8e0ea;border-radius:8px;margin-bottom:7px;font-size:15px;cursor:pointer;background:#fff;}
  .opt.sel{background:#e8f0fe;border-color:#2563eb;font-weight:700;}
  input.ans{width:100%;padding:10px;border:1px solid #d8e0ea;border-radius:8px;font-size:16px;}
  .judge{margin-top:9px;font-size:13px;border-radius:8px;padding:8px 12px;}
  .judge.right{background:#e8f7ee;color:#15803d;}
  .judge.wrong{background:#fdecea;color:#c0392b;}
  .explain{color:#6b7280;font-size:13px;margin-top:5px;line-height:1.7;}
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .stat{flex:1;min-width:110px;background:#fff;border-radius:10px;border:1px solid #e3e9f0;padding:11px;text-align:center;}
  .stat .n{font-size:21px;font-weight:800;color:#2563eb;}
  .stat .l{font-size:11px;color:#8a94a6;margin-top:2px;}
  table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;}
  th,td{padding:8px;text-align:left;border-bottom:1px solid #eef2f7;}
  th{color:#8a94a6;font-weight:600;font-size:12px;}
  .lv{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;}
  .lv.good{background:#e8f7ee;color:#15803d;} .lv.mid{background:#fff7e0;color:#b45309;} .lv.bad{background:#fdecea;color:#c0392b;}
  .empty{color:#8a94a6;text-align:center;padding:26px;font-size:13px;}
  .warn{background:#fff7e0;border:1px solid #f0d9a8;border-radius:8px;padding:11px;font-size:12.5px;color:#8a6d1a;line-height:1.7;}
  /* ===== 激活层 ===== */
  .wm{position:fixed;top:8px;right:10px;z-index:99;font-size:11px;padding:4px 11px;border-radius:12px;background:rgba(37,99,235,.12);color:#2563eb;font-weight:700;pointer-events:none;}
  .wm.trial{background:rgba(107,114,128,.14);color:#6b7280;}
  #lic-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  #lic-box{background:#fff;border-radius:16px;max-width:400px;width:100%;padding:26px 24px;box-shadow:0 18px 50px rgba(0,0,0,.3);}
  #lic-box h3{font-size:18px;margin-bottom:6px;}
  #lic-box .hint{font-size:12.5px;color:#8a94a6;line-height:1.7;margin-bottom:14px;}
  #lic-box input{width:100%;padding:12px;border:1px solid #d8e0ea;border-radius:9px;font-size:15px;letter-spacing:1px;margin-bottom:12px;text-align:center;}
  #lic-box .err{color:#c0392b;font-size:12.5px;min-height:18px;margin-bottom:8px;}
  #lic-box .row{display:flex;gap:9px;}
  #lic-box .row .btn{flex:1;}
  .lic-foot{font-size:11.5px;color:#9aa3b2;text-align:center;margin-top:14px;line-height:1.7;}
</style>
</head>
<body>

<h1>六年级数学 · 精准练习</h1>
<div class="sub">人教版六年级上 · 知识点→练习→错题→弱项,一个闭环</div>
<div class="wm trial" id="wm">试用版</div>

<div id="lic-mask" style="display:none;">
  <div id="lic-box">
    <h3>激活练习器</h3>
    <div class="hint">请输入购买时获得的激活码。未激活可点击「先试用」,试用期间练习记录仅保留当天。</div>
    <input id="lic-input" placeholder="例如:ABCD-EFGH-JKLM" maxlength="20">
    <div class="err" id="lic-err"></div>
    <div class="row">
      <button class="btn" onclick="doActivate()">激 活</button>
      <button class="btn gray" onclick="tryMode()">先试用</button>
    </div>
    <div class="lic-foot">激活码与设备绑定,每码限 3 台设备<br>换设备请联系卖家换绑</div>
  </div>
</div>

<nav>
  <a data-p="map" class="on">知识点地图</a>
  <a data-p="work">每日练习</a>
  <a data-p="wrong">错题本</a>
  <a data-p="report">弱项报告</a>
</nav>

<!-- 知识点地图 -->
<div class="page on" id="p-map">
  <h2>知识点地图(人教版六年级上)</h2>
  <div id="map"></div>
  <div class="card">
    <div class="warn">使用说明:点「每日练习」选今天学的知识点,系统抽 6 道题(难度递进)。做完自动判对错、记错题、算掌握度。每个知识点练 2~3 次,弱项报告就能告诉你哪块该补。</div>
  </div>
</div>

<!-- 每日练习 -->
<div class="page" id="p-work">
  <h2>每日练习</h2>
  <div class="card">
    <div style="font-size:14px;font-weight:700;margin-bottom:10px;">选练习方式:</div>
    <div style="display:flex;gap:18px;margin-bottom:12px;font-size:14px;flex-wrap:wrap;">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="radio" name="mode" value="unit" checked> <b>每日一练</b>(整单元 20 题)</label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="radio" name="mode" value="point"> 知识点专项(6 题)</label>
    </div>
    <select id="sel-unit" style="width:100%;padding:9px;border:1px solid #d8e0ea;border-radius:8px;font-size:14px;margin-bottom:8px;"></select>
    <select id="sel-point" style="width:100%;padding:9px;border:1px solid #d8e0ea;border-radius:8px;font-size:14px;margin-bottom:12px;display:none;"></select>
    <button class="btn" onclick="startWork()">开始练习</button>
  </div>
  <div id="work-area"></div>
</div>

<!-- 错题本 -->
<div class="page" id="p-wrong">
  <h2>错题本</h2>
  <div id="wrong-list"></div>
</div>

<!-- 弱项报告 -->
<div class="page" id="p-report">
  <h2>弱项报告</h2>
  <div id="report"></div>
</div>

<script>
// ===== 激活系统 =====
// 码表由卖家生成器注入: { "XXXX-XXXX-XXXX": { owner: "买家昵称", devices: 3 } }
var ACTIVATION = {};
var LIC_KEY = 'math6_lic';
function licGet(){ try{ return JSON.parse(localStorage.getItem(LIC_KEY)||'null'); }catch(e){ return null; } }
function licSet(v){ localStorage.setItem(LIC_KEY, JSON.stringify(v)); }
function licActive(){
  var l = licGet();
  if(!l || !l.code) return null;
  var entry = ACTIVATION[l.code];
  if(!entry) return null;
  return entry;  // {owner, devices}
}
function wmShow(txt, trial){
  var w = document.getElementById('wm');
  w.textContent = txt;
  w.className = 'wm' + (trial ? ' trial' : '');
}
function initLic(){
  var entry = licActive();
  if(entry){ wmShow(entry.owner + ' · 专属版', false); return; }
  wmShow('试用版', true);
  document.getElementById('lic-mask').style.display = 'flex';
}
function tryMode(){
  document.getElementById('lic-mask').style.display = 'none';
  wmShow('试用版', true);
}
function doActivate(){
  var inp = document.getElementById('lic-input');
  var err = document.getElementById('lic-err');
  var code = (inp.value||'').trim().toUpperCase().replace(/\s+/g,'');
  if(!code){ err.textContent = '请输入激活码'; return; }
  var entry = ACTIVATION[code];
  if(!entry){ err.textContent = '激活码无效,请核对后重试(注意字母数字)'; return; }
  var l = licGet() || {};
  l.code = code; l.ts = Date.now();
  licSet(l);
  document.getElementById('lic-mask').style.display = 'none';
  wmShow(entry.owner + ' · 专属版', false);
}
window.addEventListener('DOMContentLoaded', initLic);

=24×(5/3)=40。"}], "b2": [{"type": "choice", "stem": "根据比的基本性质，把6:8化成最简比是（）。", "options": ["A. 3:4", "B. 4:3", "C. 2:4", "D. 6:4"], "answer": "A", "explain": "根据比的基本性质，前项和后项同时除以最大公因数2，6:8化简为3:4。"}, {"type": "choice", "stem": "把 1/2 : 1/3 化成最简比是（）。", "options": ["A. 3:2", "B. 2:3", "C. 1:6", "D. 1:1"], "answer": "A", "explain": "比的前项和后项同时乘以6，1/2:1/3 = 3:2，已是最简比。"}, {"type": "blank", "stem": "化简比 0.25:0.5 = （  ）（写成a:b的形式）", "answer": "1:2", "explain": "前项和后项同时除以0.25，0.25:0.5 = 1:2。"}, {"type": "blank", "stem": "化简比 3/8:5/6 = （  ）（写成a:b的形式）", "answer": "9:20", "explain": "前项和后项同时乘以24，3/8:5/6 = 9:20，已是最简比。"}, {"type": "calc", "stem": "化简比 1.5:3/10:0.9", "answer": "5:1:3", "explain": "先将1.5和0.9化成小数，1.5:0.3:0.9，再同时除以0.3，得5:1:3。"}, {"type": "calc", "stem": "一个三角形三个内角的度数比是2:3:7，求这三个内角各是多少度？", "answer": "30°、45°、105°", "explain": "三角形内角和为180°，分成2+3+7=12份，每份15°，三角分别为2×15°=30°、3×15°=45°、7×15°=105°。"}], "b3": [{"type": "choice", "stem": "把120按2:3分配，较小的一份是多少？", "options": ["A. 48", "B. 72", "C. 60", "D. 24"], "answer": "A", "explain": "总份数为2+3=5，较小一份占2/5，即120×2/5=48。"}, {"type": "choice", "stem": "甲乙两数之比是3:5，甲数是24，乙数是多少？", "options": ["A. 30", "B. 36", "C. 40", "D. 45"], "answer": "C", "explain": "甲占3份，每份为24÷3=8，乙占5份，即8×5=40。"}, {"type": "blank", "stem": "把360按4:5:6分配，最大一份是多少？", "answer": "144", "explain": "总份数为4+5+6=15，最大一份占6/15，即360×6/15=144。"}, {"type": "blank", "stem": "一个三角形三个内角度数比是2:3:4，最小的角是多少度？", "answer": "40", "explain": "三角形内角和为180°，总份数为2+3+4=9，最小角为180×2/9=40°。"}, {"type": "calc", "stem": "学校买来图书460本，按人数分配给六年级三个班，一班有40人，二班有38人，三班有37人，二班分得多少本？", "answer": "152", "explain": "总人数为40+38+37=115人，二班分得460×38/115=4×38=152（本）。"}, {"type": "calc", "stem": "甲乙两数之和是230，甲数的3/4等于乙数的2/5，求甲乙两数各是多少？", "answer": "甲=80，乙=150", "explain": "由3/4×甲=2/5×乙，得甲:乙=8:15，总份数23份，甲=230×8/23=80，乙=230×15/23=150。"}], "c1": [{"type": "choice", "stem": "在同一个圆中，半径 r 和直径 d 之间的关系是（    ）。", "options": ["A. d = 2r", "B. r = 2d", "C. d = r", "D. d = 4r"], "answer": "A", "explain": "同一个圆中，直径等于半径的2倍，即 d = 2r。"}, var DB = { done: [], wrong: [] };  // done: {pid, right, total}; wrong: {pid, pname, stem, myAns, rightAns, explain, type, options}
function load(){ try{ var s = localStorage.getItem('math6_db'); if(s) DB = JSON.parse(s); }catch(e){ DB={done:[],wrong:[]}; } }
function save(){ localStorage.setItem('math6_db', JSON.stringify(DB)); }

function pname(pid){ for(var u of UNITS){ for(var p of u.points){ if(p.id===pid) return p.name; } } return pid; }
function unitName(pid){ for(var u of UNITS){ for(var p of u.points){ if(p.id===pid) return u.name; } } return ''; }

// ===== 知识点地图 =====
function renderMap(){
  var el = document.getElementById('map'); el.innerHTML = '';
  UNITS.forEach(function(u){
    var d = document.createElement('div'); d.className = 'card unit';
    d.innerHTML = '<div class="unit-h">'+u.name+'</div><div class="pts"></div>';
    var pts = d.querySelector('.pts');
    u.points.forEach(function(p){
      var rec = DB.done.find(function(x){return x.pid===p.id;});
      var pct = rec && rec.total>0 ? Math.round(rec.right/rec.total*100) : null;
      var bar = pct===null ? '' : '<span class="bar">'+pct+'%</span>';
      var s = document.createElement('span'); s.className='pt';
      s.textContent = p.name;
      s.innerHTML = p.name + bar;
      s.onclick = function(){ selPoint(p.id); switchPage('work'); };
      pts.appendChild(s);
    });
    el.appendChild(d);
  });
}

var curPid = null, curQs = null, answers = {};

function initSelects(){
  var u = document.getElementById('sel-unit'); u.innerHTML = '';
  UNITS.forEach(function(x){ u.innerHTML += '<option value="'+x.name+'">'+x.name+'</option>'; });
  fillPoints();
}
function fillPoints(){
  var un = document.getElementById('sel-unit').value;
  var p = document.getElementById('sel-point'); p.innerHTML = '';
  UNITS.forEach(function(x){ if(x.name===un){ x.points.forEach(function(pt){ p.innerHTML += '<option value="'+pt.id+'">'+pt.name+'</option>'; }); } });
}
document.getElementById('sel-unit').addEventListener('change', fillPoints);

function selPoint(pid){
  // 知识点地图点击:切到专项模式并选中该知识点
  document.querySelectorAll('input[name="mode"]').forEach(function(r){ r.checked = (r.value==='point'); });
  var un = unitName(pid);
  if(un) document.getElementById('sel-unit').value = un;
  fillPoints();
  document.getElementById('sel-point').value = pid;
  document.getElementById('sel-point').style.display = '';
}

function modeChanged(){
  var mode = document.querySelector('input[name="mode"]:checked').value;
  document.getElementById('sel-point').style.display = (mode==='point') ? '' : 'none';
}
document.querySelectorAll('input[name="mode"]').forEach(function(r){ r.onchange = modeChanged; });

function startWork(){
  var mode = document.querySelector('input[name="mode"]:checked').value;
  if(mode === 'unit'){
    // 单元20题:该单元所有知识点轮询抽题(均匀覆盖)
    var un = document.getElementById('sel-unit').value;
    var groups = {};
    UNITS.forEach(function(u){ if(u.name===un){ u.points.forEach(function(p){ (BANK[p.id]||[]).forEach(function(q){ (groups[p.id]=groups[p.id]||[]).push(q); }); }); } });
    var pids = Object.keys(groups);
    if(!pids.length){ alert('这个单元的题还没录入'); return; }
    var picked = [], ri = 0;
    while(picked.length < 20){
      var added = false;
      pids.forEach(function(pid){
        if(picked.length >= 20) return;
        if(ri < groups[pid].length){ picked.push({pid: pid, q: groups[pid][ri]}); added = true; }
      });
      if(!added) break;
      ri++;
    }
    curPid = '__unit__';
    curQs = picked;
  } else {
    var pid = document.getElementById('sel-point').value;
    var qs = BANK[pid] || [];
    if(!qs.length){ alert('这个知识点的题还没录入,换一个试试'); return; }
    curPid = pid;
    curQs = qs.slice(0,6).map(function(q){ return {pid: pid, q: q}; });
  }
  answers = {};
  renderWork();
}

function renderWork(){
  var el = document.getElementById('work-area');
  var title = (curPid==='__unit__') ? (document.getElementById('sel-unit').value + ' · 每日一练') : pname(curPid);
  el.innerHTML = '<div class="card"><div style="font-size:14px;font-weight:700;margin-bottom:4px;">'+title+'</div><div style="font-size:12px;color:#8a94a6;margin-bottom:10px;">共 '+curQs.length+' 题,做完点"交卷判分"</div></div>';
  curQs.forEach(function(item, i){
    var q = item.q;
    var d = document.createElement('div'); d.className='card q';
    var tag = q.type==='choice' ? '选择题' : q.type==='blank' ? '填空题' : '计算/应用题';
    var html = '<div class="stem"><span class="tag">'+tag+'</span>'+escapeHtml(q.stem)+'</div>';
    if(q.type==='choice'){
      html += '<div id="opt-'+i+'">';
      (q.options||[]).forEach(function(o, k){
        html += '<div class="opt" onclick="pickOpt('+i+','+k+')">'+escapeHtml(o)+'</div>';
      });
      html += '</div>';
    } else {
      html += '<input class="ans" id="ans-'+i+'" placeholder="答案写成 3/4 这样的分数形式" oninput="answers['+i+']=this.value">';
    }
    html += '<div id="judge-'+i+'"></div>';
    d.innerHTML = html;
    el.appendChild(d);
  });
  el.innerHTML += '<button class="btn green" onclick="submitAll()">交卷判分</button>';
}

function pickOpt(qi, k){
  answers[qi] = ['A','B','C','D'][k];
  document.querySelectorAll('#opt-'+qi+' .opt').forEach(function(x, j){ x.classList.toggle('sel', j===k); });
}

function normalize(s){
  s = String(s||'').trim().replace(/\s+/g,'').replace(/^=/, '').replace(/,/g,'');
  return s;
}
// 数学等价比较:支持 2/5=0.4、2又4/5=14/5 这类写法
function toFrac(s){
  s = normalize(s);
  if(!s) return null;
  var m = s.match(/^(\d+)又(\d+)\/(\d+)$/);
  if(m) return [parseInt(m[1])*parseInt(m[3])+parseInt(m[2]), parseInt(m[3])];
  m = s.match(/^(\d+)\/(\d+)$/);
  if(m) return [parseInt(m[1]), parseInt(m[2])];
  m = s.match(/^(\d+\.\d+)$/);
  if(m){
    var ds = m[1].split('.')[1].length;
    var den = Math.pow(10, ds);
    return [Math.round(parseFloat(m[1]) * den), den];
  }
  m = s.match(/^-?\d+$/);
  if(m) return [parseInt(m[1]), 1];
  return null;
}
function fracEq(a, b){
  var fa = toFrac(a), fb = toFrac(b);
  if(!fa || !fb) return normalize(a) === normalize(b);
  function gcd(x, y){ while(y){ var t = x % y; x = y; y = t; } return x; }
  var ga = gcd(Math.abs(fa[0]), fa[1]), gb = gcd(Math.abs(fb[0]), fb[1]);
  return fa[0]/ga === fb[0]/gb && fa[1]/ga === fb[1]/gb;
}

function submitAll(){
  if(!curQs) return;
  var right = 0;
  var pidStat = {};
  curQs.forEach(function(item, i){
    var q = item.q, pid = item.pid;
    var mine = q.type==='choice' ? (answers[i]||'') : (document.getElementById('ans-'+i)||{value:''}).value;
    var ok = fracEq(mine, q.answer);
    if(ok) right++;
    if(!pidStat[pid]) pidStat[pid] = {right:0, total:0};
    pidStat[pid].total++;
    if(ok) pidStat[pid].right++;
    var jd = document.getElementById('judge-'+i);
    if(ok){
      jd.innerHTML = '<div class="judge right">✓ 正确!</div>';
    } else {
      jd.innerHTML = '<div class="judge wrong">✗ 答错了。正确答案: '+escapeHtml(q.answer)+'</div>';
      DB.wrong.push({pid:pid, pname:pname(pid), stem:q.stem, type:q.type, options:q.options||[], myAns:mine, rightAns:q.answer, explain:q.explain||'', time:new Date().toISOString().slice(0,10)});
    }
    if(q.explain) jd.innerHTML += '<div class="explain">解析: '+escapeHtml(q.explain)+'</div>';
  });
  // 按知识点分别累计掌握度
  Object.keys(pidStat).forEach(function(pid){
    var rec = DB.done.find(function(x){return x.pid===pid;});
    if(!rec){ rec = {pid:pid, right:0, total:0}; DB.done.push(rec); }
    rec.right += pidStat[pid].right; rec.total += pidStat[pid].total;
  });
  save();
  var box = document.createElement('div');
  box.className = 'card';
  box.style.marginTop = '12px';
  box.innerHTML = '<div style="font-size:16px;font-weight:800;">本次得分: '+right+' / '+curQs.length+'</div><div style="font-size:13px;color:#8a94a6;margin-top:4px;">错题已自动收进错题本,各知识点掌握度已更新。</div>';
  document.getElementById('work-area').appendChild(box);
  window.scrollTo(0, document.body.scrollHeight);
}

// ===== 错题本 =====
function renderWrong(){
  var el = document.getElementById('wrong-list');
  if(!DB.wrong.length){ el.innerHTML = '<div class="card empty">还没有错题,继续加油!</div>'; return; }
  var h = '<div class="card"><button class="btn gray" onclick="clearWrong()">清空错题本</button></div>';
  DB.wrong.slice().reverse().forEach(function(w, i){
    h += '<div class="card"><div class="stem" style="font-size:15px;line-height:1.7;margin-bottom:6px;">['+w.pname+'] '+escapeHtml(w.stem)+'</div>';
    h += '<div style="font-size:13px;color:#c0392b;">我的答案: '+escapeHtml(w.myAns||'(空)')+'</div>';
    h += '<div style="font-size:13px;color:#15803d;">正确答案: '+escapeHtml(w.rightAns)+'</div>';
    if(w.explain) h += '<div class="explain">解析: '+escapeHtml(w.explain)+'</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}
function clearWrong(){ if(confirm('确定清空所有错题?')){ DB.wrong = []; save(); renderWrong(); } }

// ===== 弱项报告 =====
function renderReport(){
  var el = document.getElementById('report');
  if(!DB.done.length){ el.innerHTML = '<div class="card empty">还没有练习记录。先到「每日练习」做几套题,这里就会自动生成弱项报告。</div>'; return; }
  var rows = DB.done.map(function(r){
    var pct = r.total ? Math.round(r.right/r.total*100) : 0;
    return {pid:r.pid, name:pname(r.pid), unit:unitName(r.pid), right:r.right, total:r.total, pct:pct};
  }).sort(function(a,b){ return a.pct - b.pct; });
  var weak = rows.filter(function(r){return r.pct < 60;});
  var mid = rows.filter(function(r){return r.pct >= 60 && r.pct < 85;});
  var good = rows.filter(function(r){return r.pct >= 85;});
  var h = '<div class="stat-row">'
    + '<div class="stat"><div class="n" style="color:#c0392b;">'+weak.length+'</div><div class="l">薄弱(60%以下)</div></div>'
    + '<div class="stat"><div class="n" style="color:#b45309;">'+mid.length+'</div><div class="l">一般(60-85%)</div></div>'
    + '<div class="stat"><div class="n" style="color:#15803d;">'+good.length+'</div><div class="l">掌握(85%以上)</div></div>'
    + '</div>';
  if(weak.length){
    h += '<div class="card"><div style="font-size:14px;font-weight:700;color:#c0392b;margin-bottom:8px;">⚠️ 本周重点补这些(按薄弱程度排):</div>';
    weak.forEach(function(r){
      h += '<div style="font-size:14px;line-height:1.9;">• <b>'+r.name+'</b>(正确率 '+r.pct+'%)——到「每日练习」再练 2 次,错题本里有它所有错题</div>';
    });
    h += '</div>';
  } else {
    h += '<div class="card"><div style="color:#15803d;font-size:14px;font-weight:700;">👍 没有明显弱项,继续保持!</div></div>';
  }
  h += '<div class="card"><table><tr><th>知识点</th><th>单元</th><th>做题</th><th>正确率</th><th>掌握度</th></tr>';
  rows.forEach(function(r){
    var lv = r.pct>=85 ? '<span class="lv good">掌握</span>' : r.pct>=60 ? '<span class="lv mid">一般</span>' : '<span class="lv bad">薄弱</span>';
    h += '<tr><td>'+r.name+'</td><td>'+r.unit.replace('第一单元 ','').replace('第二单元 ','').replace('第三单元 ','').replace('第四单元 ','').replace('第五单元 ','').replace('第六单元 ','').replace('第七单元 ','').replace('第八单元 ','')+'</td><td>'+r.total+'</td><td>'+r.pct+'%</td><td>'+lv+'</td></tr>';
  });
  h += '</table></div>';
  el.innerHTML = h;
}

// ===== 导航 =====
function switchPage(p){
  document.querySelectorAll('nav a').forEach(function(a){ a.classList.toggle('on', a.dataset.p===p); });
  document.querySelectorAll('.page').forEach(function(x){ x.classList.toggle('on', x.id==='p-'+p); });
  if(p==='map') renderMap();
  if(p==='wrong') renderWrong();
  if(p==='report') renderReport();
}
document.querySelectorAll('nav a').forEach(function(a){ a.onclick = function(){ switchPage(a.dataset.p); }; });

function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

load(); initSelects(); renderMap();
</script>
