<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>高考真题刷题器</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e17; --card:#141a26; --card2:#1a2233; --line:#25304a;
  --txt:#e8eef7; --dim:#8899b0; --blue:#3b82f6; --cyan:#06b6d4;
  --green:#10b981; --red:#ef4444; --amber:#f59e0b; --purple:#8b5cf6;
}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--txt); min-height:100vh;
  padding:20px 14px 40px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
body::before{
  content:''; position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(59,130,246,.18), transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 20%, rgba(139,92,246,.14), transparent 60%),
    radial-gradient(ellipse 70% 50% at 50% 100%, rgba(6,182,212,.10), transparent 60%);
}
.wrap{max-width:720px;margin:0 auto}
.hide{display:none!important}

/* 顶部 */
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back{
  width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;flex-shrink:0;
  transition:.15s;
}
.back:active{background:var(--card2);transform:scale(.94)}
h1{font-size:21px;font-weight:900;letter-spacing:-.4px}
h1 .g{background:linear-gradient(135deg,#60a5fa,#a78bfa,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--dim);font-size:12px;margin:4px 0 16px}

/* 数据概览 */
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;
}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:12px 6px;text-align:center;
}
.stat .v{font-size:20px;font-weight:900;line-height:1.2}
.stat .l{font-size:10.5px;color:var(--dim);margin-top:3px}
.stat.blue .v{color:#60a5fa}
.stat.green .v{color:#34d399}
.stat.red .v{color:#f87171}
.stat.amber .v{color:#fbbf24}

/* 科目卡片 */
.sec{margin:20px 0 9px;font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.5px;display:flex;align-items:center;gap:7px}
.sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.subjs{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:9px}
.sj{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 10px;text-align:center;cursor:pointer;overflow:hidden;transition:.16s;
}
.sj::before{
  content:'';position:absolute;inset:0;opacity:0;transition:.2s;
  background:linear-gradient(135deg,rgba(59,130,246,.16),rgba(139,92,246,.10));
}
.sj:active{transform:scale(.97)}
.sj:active::before{opacity:1}
.sj .ico{font-size:22px;margin-bottom:5px}
.sj .n{font-size:15px;font-weight:800}
.sj .c{font-size:11px;color:var(--dim);margin-top:2px}

/* 薄弱点 */
.weak{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.wrow{display:flex;justify-content:space-between;align-items:center;margin:9px 0;font-size:13px}
.wbar{height:6px;background:#0b1220;border-radius:3px;overflow:hidden;margin-top:4px}
.wbar i{display:block;height:100%;border-radius:3px;transition:width .4s}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:14px 0}

/* 错题入口 */
.entry{
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,rgba(239,68,68,.12),rgba(245,158,11,.08));
  border:1px solid rgba(239,68,68,.3);border-radius:14px;padding:15px 17px;
  cursor:pointer;margin-top:9px;transition:.15s;
}
.entry:active{transform:scale(.99)}
.entry .l{font-size:15px;font-weight:800}
.entry .d{font-size:11.5px;color:var(--dim);margin-top:2px}
.entry .r{font-size:20px;color:var(--red);font-weight:900}

/* 做题 */
.progress{height:5px;background:#0b1220;border-radius:3px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 17px}
.qbar{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--dim);margin-bottom:12px;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10.5px;font-weight:700}
.tag.m{background:rgba(139,92,246,.18);color:#c4b5fd}
.tag.s{background:rgba(59,130,246,.16);color:#93c5fd}
.qtext{font-size:15.5px;line-height:1.9;margin-bottom:16px;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font-size:14.5px;
  cursor:pointer;display:flex;gap:10px;background:var(--card2);transition:.13s;word-break:break-word;
}
.opt:active{transform:scale(.99)}
.opt .lb{font-weight:900;color:var(--dim);flex-shrink:0;width:18px}
.opt.sel{border-color:var(--blue);background:rgba(59,130,246,.14)}
.opt.sel .lb{color:#93c5fd}
.opt.right{border-color:var(--green);background:rgba(16,185,129,.14)}
.opt.right .lb{color:#34d399}
.opt.wrong{border-color:var(--red);background:rgba(239,68,68,.14)}
.opt.wrong .lb{color:#f87171}

.exp{
  background:#0b1220;border-left:3px solid var(--cyan);border-radius:0 10px 10px 0;
  padding:13px 15px;font-size:13.5px;color:#c7d4e8;margin-top:14px;line-height:1.85;word-break:break-word;
}
.exp b.ok{color:#34d399}
.exp b.no{color:#f87171}
.btn{
  display:block;width:100%;padding:15px;border:none;border-radius:13px;font-size:16px;font-weight:800;
  cursor:pointer;margin-top:14px;transition:.15s;font-family:inherit;
}
.btn:active{transform:scale(.98)}
.bp{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;box-shadow:0 4px 16px rgba(59,130,246,.3)}
.bg2{background:var(--card2);color:var(--dim);border:1px solid var(--line)}

/* 成绩页 */
.result{text-align:center;padding:10px 0 4px}
.bigrate{font-size:52px;font-weight:900;line-height:1;background:linear-gradient(135deg,#34d399,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}
.rstat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
.rstat .v{font-size:22px;font-weight:900}
.rstat .l{font-size:11px;color:var(--dim);margin-top:2px}

/* 错题列表 */
.wcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:9px}
.wmeta{font-size:10.5px;color:var(--dim);margin-bottom:5px}
.wq{font-size:13.5px;line-height:1.7;word-break:break-word}
.wans{font-size:12px;margin-top:6px}
.wans .a{color:#f87171;font-weight:700}
.wans .b{color:#34d399;font-weight:700}
.del{
  background:none;border:none;color:var(--dim);font-size:11px;cursor:pointer;
  padding:4px 8px;font-family:inherit;
}
</style>
</head>
<body>
<div class="wrap">

<!-- ========== 首页 ========== -->
<div id="home">
  <div class="top"><h1>高考真题<span class="g">刷题器</span></h1></div>
  <div class="sub">2010-2026 全国卷 + 山东真题 · 带官方答案和解析</div>

  <div class="stats">
    <div class="stat blue"><div class="v" id="stDone">0</div><div class="l">已做</div></div>
    <div class="stat green"><div class="v" id="stRate">—</div><div class="l">正确率</div></div>
    <div class="stat red"><div class="v" id="stWrong">0</div><div class="l">错题</div></div>
    <div class="stat amber"><div class="v" id="stDays">0</div><div class="l">天数</div></div>
  </div>

  <div class="sec">选择科目</div>
  <div class="subjs" id="subjList"></div>

  <div class="sec">我的薄弱点</div>
  <div class="weak" id="weakBox"><div class="empty">还没做题，做完自动统计</div></div>

  <div class="entry" onclick="openWrong()">
    <div><div class="l">📕 错题本</div><div class="d">做错的题都在这，可以重做</div></div>
    <div class="r" id="wrongCnt">0</div>
  </div>
</div>

<!-- ========== 做题 ========== -->
<div id="quiz" class="hide">
  <div class="top">
    <div class="back" onclick="goHome()">‹</div>
    <h1 style="font-size:17px" id="quizTitle">刷题</h1>
  </div>
  <div class="progress"><i id="pbar" style="width:0%"></i></div>
  <div class="qcard">
    <div class="qbar">
      <span id="qno">第 1 题</span>
      <span id="qmeta"></span>
    </div>
    <div class="qtext" id="qtext"></div>
    <div id="qbody"></div>
    <div id="qexp" class="hide"></div>
    <div id="qbtns"></div>
  </div>
</div>

<!-- ========== 成绩 ========== -->
<div id="result" class="hide">
  <div class="top">
    <div class="back" onclick="goHome()">‹</div>
    <h1 style="font-size:17px">本轮成绩</h1>
  </div>
  <div class="qcard">
    <div class="result"><div class="bigrate" id="rate">0%</div></div>
    <div class="rstats">
      <div class="rstat"><div class="v" id="rTotal">0</div><div class="l">做了</div></div>
      <div class="rstat"><div class="v" style="color:#34d399" id="rRight">0</div><div class="l">对</div></div>
      <div class="rstat"><div class="v" style="color:#f87171" id="rWrong">0</div><div class="l">错</div></div>
    </div>
    <div class="sec" style="margin-top:6px">本轮薄弱点</div>
    <div id="roundWeak"></div>
  </div>
  <button class="btn bp" onclick="goHome()">回首页</button>
</div>

<!-- ========== 错题本 ========== -->
<div id="wrongPage" class="hide">
  <div class="top">
    <div class="back" onclick="goHome()">‹</div>
    <h1 style="font-size:17px">错题本</h1>
  </div>
  <div class="sub" id="wrongSub">共 0 题</div>
  <div id="wrongList"></div>
  <button class="btn bg2" onclick="clearWrong()" style="margin-top:16px">清空错题本</button>
</div>

</div>

<script>
let IDX = null, BANK = {}, SUBJ='', LIST=[], idx=0, right=0, wrongs=[], picked=null, pickedMulti=[], fromWrong=false;

// ========== 本地存储 ==========
const LS = {
  get(k, d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function getStats(){ return LS.get('dsh_stats', {done:0, right:0, days:[], kn:{}}); }
function saveStats(s){ LS.set('dsh_stats', s); }
function getWrongBook(){ return LS.get('dsh_wrong', []); }
function saveWrongBook(a){ LS.set('dsh_wrong', a); }

// ========== 工具 ==========
function esc(s){ return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escKeepImg(s){
  s = String(s);
  const imgs=[];
  s = s.replace(/<img[^>]*>/g, function(m){ imgs.push(m); return '\u0000IMG'+(imgs.length-1)+'\u0000'; });
  s = s.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/\u0000IMG(\d+)\u0000/g, function(_,i){ return imgs[+i]; });
  return s;
}
function renderMath(el){
  if(!window.renderMathInElement) return;
  try{
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:false},{left:'$',right:'$',display:false}],throwOnError:false});
  }catch(e){}
}

// ========== 首页 ==========
async function loadIndex(){
  const r = await fetch('tiku/index.json?t='+Date.now());
  IDX = await r.json();
  const box = document.getElementById('subjList');
  box.innerHTML='';
  const icons = {'数学':'📐','物理':'⚛️','化学':'🧪','生物':'🧬','英语':'📖'};
  IDX.subjects.forEach(s=>{
    const d=document.createElement('div');
    d.className='sj';
    d.innerHTML = `<div class="ico">${icons[s.name]||'📚'}</div><div class="n">${s.name}</div><div class="c">${s.count} 题</div>`;
    d.onclick=()=>startSubject(s.name, s.file);
    box.appendChild(d);
  });
  renderHomeStats();
}
loadIndex();

function renderHomeStats(){
  const s = getStats();
  document.getElementById('stDone').textContent = s.done;
  document.getElementById('stRate').textContent = s.done ? Math.round(s.right/s.done*100)+'%' : '—';
  const wb = getWrongBook();
  document.getElementById('stWrong').textContent = wb.length;
  document.getElementById('stDays').textContent = (s.days||[]).length;
  document.getElementById('wrongCnt').textContent = wb.length;

  // 薄弱点 TOP5
  const box = document.getElementById('weakBox');
  const kn = s.kn || {};
  const arr = Object.entries(kn).map(([k,v])=>[k, v]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const totalWrong = Object.values(kn).reduce((a,b)=>a+b,0);
  if(!arr.length){ box.innerHTML = '<div class="empty">还没做题，做完自动统计</div>'; return; }
  const max = arr[0][1];
  box.innerHTML = arr.map(([k,c],i)=>{
    const pct = Math.round(c/max*100);
    const color = i===0?'#f87171':(i===1?'#fbbf24':'#60a5fa');
    return `<div><div class="wrow"><span>${k}</span><span style="color:${color};font-weight:800">错 ${c}</span></div><div class="wbar"><i style="width:${pct}%;background:${color}"></i></div></div>`;
  }).join('');
}

function goHome(){
  document.getElementById('quiz').classList.add('hide');
  document.getElementById('result').classList.add('hide');
  document.getElementById('wrongPage').classList.add('hide');
  document.getElementById('home').classList.remove('hide');
  renderHomeStats();
  window.scrollTo(0,0);
}

// ========== 开始做题 ==========
async function startSubject(name, file){
  SUBJ = name;
  fromWrong = false;
  if(!BANK[name]){
    try{
      const r = await fetch('tiku/'+file+'?t='+Date.now());
      BANK[name] = await r.json();
    }catch(e){ alert('题库加载失败，请检查网络'); return; }
  }
  LIST = BANK[name].slice();
  shuffle(LIST);
  if(LIST.length>30) LIST = LIST.slice(0,30);
  idx=0; right=0; wrongs=[];
  document.getElementById('home').classList.add('hide');
  document.getElementById('quiz').classList.remove('hide');
  document.getElementById('quizTitle').textContent = name;
  document.getElementById('pbar').style.width='0%';
  show();
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

// ========== 显示题 ==========
function show(){
  const q = LIST[idx];
  picked=null; pickedMulti=[];
  document.getElementById('pbar').style.width = (idx/LIST.length*100)+'%';
  document.getElementById('qno').textContent = `第 ${idx+1} 题 / ${LIST.length}`;
  const isMulti = String(q.a).length>1;
  document.getElementById('qmeta').innerHTML =
    `<span class="tag ${isMulti?'m':'s'}">${isMulti?'多选':'单选'}</span> ${SUBJ} · ${q.y||''} ${q.c||''}`;
  document.getElementById('qtext').innerHTML = escKeepImg(q.q);
  const body = document.getElementById('qbody');
  body.innerHTML='';
  const wrap = document.createElement('div');
  wrap.className='opts';
  q.o.forEach((op,i)=>{
    const d=document.createElement('div');
    d.className='opt';
    d.innerHTML = `<span class="lb">${'ABCD'[i]}</span><span>${escKeepImg(op)}</span>`;
    d.onclick=()=>{
      if(!document.getElementById('qexp').classList.contains('hide')) return;
      if(isMulti){
        if(pickedMulti.includes('ABCD'[i])){
          pickedMulti = pickedMulti.filter(x=>x!=='ABCD'[i]);
          d.classList.remove('sel');
        }else{
          pickedMulti.push('ABCD'[i]);
          d.classList.add('sel');
        }
      }else{
        wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
        d.classList.add('sel');
        picked='ABCD'[i];
      }
    };
    wrap.appendChild(d);
  });
  body.appendChild(wrap);
  const exp=document.getElementById('qexp');
  exp.classList.add('hide'); exp.innerHTML='';
  document.getElementById('qbtns').innerHTML='<button class="btn bp" onclick="submit()">提交</button>';
  renderMath(body); renderMath(document.getElementById('qtext'));
  window.scrollTo(0,0);
}

// ========== 提交判题 ==========
function submit(){
  const q = LIST[idx];
  const isMulti = String(q.a).length>1;
  let mine, ok;
  if(isMulti){
    if(!pickedMulti.length){ alert('至少选一个'); return; }
    mine = pickedMulti.slice().sort().join('');
    ok = mine === String(q.a).split('').sort().join('');
  }else{
    if(!picked){ alert('先选一个'); return; }
    mine = picked;
    ok = picked === q.a;
  }

  // 记录
  if(ok) right++;
  else wrongs.push({q:q.q, o:q.o, a:q.a, mine:mine, y:q.y, c:q.c, k:q.k||'其他', subj:SUBJ, multi:isMulti});

  // 客观题标记
  const allOpts = document.querySelectorAll('.opt');
  allOpts.forEach((el,i)=>{
    const lb='ABCD'[i];
    const correctSet = String(q.a).split('');
    const mineSet = isMulti?pickedMulti:[picked];
    if(correctSet.includes(lb)) el.classList.add('right');
    else if(mineSet.includes(lb)) el.classList.add('wrong');
  });

  const exp=document.getElementById('qexp');
  exp.innerHTML = `<div class="exp"><b class="${ok?'ok':'no'}">${ok?'✓ 答对了':'✗ 答错了'}</b>　正确答案：<b>${q.a}</b>${q.ex?('<br>'+escKeepImg(q.ex)):''}</div>`;
  exp.classList.remove('hide');
  renderMath(exp);
  document.getElementById('qbtns').innerHTML =
    `<button class="btn bp" onclick="next()">${idx>=LIST.length-1?'看成绩':'下一题'}</button>`;
}

function next(){
  idx++;
  if(idx>=LIST.length) finish();
  else show();
}

// ========== 成绩 ==========
function finish(){
  document.getElementById('quiz').classList.add('hide');
  document.getElementById('result').classList.remove('hide');
  const total = LIST.length;
  document.getElementById('rTotal').textContent = total;
  document.getElementById('rRight').textContent = right;
  document.getElementById('rWrong').textContent = wrongs.length;
  document.getElementById('rate').textContent = (total?Math.round(right/total*100):0)+'%';

  // 本轮薄弱点
  const kn = {};
  wrongs.forEach(w=>{ kn[w.k]=(kn[w.k]||0)+1; });
  const arr = Object.entries(kn).sort((a,b)=>b[1]-a[1]);
  const rb = document.getElementById('roundWeak');
  if(!arr.length){ rb.innerHTML='<div class="empty">全对，厉害</div>'; }
  else{
    const max=arr[0][1];
    rb.innerHTML = arr.map(([k,c],i)=>{
      const pct=Math.round(c/max*100);
      const color=i===0?'#f87171':(i===1?'#fbbf24':'#60a5fa');
      return `<div><div class="wrow"><span>${k}</span><span style="color:${color};font-weight:800">错 ${c}</span></div><div class="wbar"><i style="width:${pct}%;background:${color}"></i></div></div>`;
    }).join('');
  }

  // 存数据
  const s = getStats();
  s.done += total;
  s.right += right;
  const today = new Date().toDateString();
  if(!s.days) s.days=[];
  if(!s.days.includes(today)) s.days.push(today);
  if(!s.kn) s.kn={};
  wrongs.forEach(w=>{ s.kn[w.k]=(s.kn[w.k]||0)+1; });
  saveStats(s);

  // 存错题
  const wb = getWrongBook();
  wrongs.forEach(w=>{
    const key = String(w.q).replace(/<[^>]+>/g,'').slice(0,60);
    if(!wb.some(x=>String(x.q).replace(/<[^>]+>/g,'').slice(0,60)===key)){
      wb.push({q:w.q,o:w.o,a:w.a,mine:w.mine,y:w.y,c:w.c,k:w.k,subj:w.subj,multi:w.multi,t:Date.now()});
    }
  });
  saveWrongBook(wb);
  window.scrollTo(0,0);
}

// ========== 错题本 ==========
function openWrong(){
  document.getElementById('home').classList.add('hide');
  document.getElementById('wrongPage').classList.remove('hide');
  const wb = getWrongBook();
  document.getElementById('wrongSub').textContent = `共 ${wb.length} 题`;
  const box = document.getElementById('wrongList');
  if(!wb.length){ box.innerHTML='<div class="empty">还没有错题，去做几道题吧</div>'; return; }
  box.innerHTML = wb.slice().reverse().map((w,i)=>`
    <div class="wcard">
      <div class="wmeta">${w.subj||''} · ${w.y||''} ${w.c||''} · ${w.k||''}　<button class="del" onclick="delWrong(${wb.length-1-i})">删除</button></div>
      <div class="wq">${escKeepImg(String(w.q).replace(/<img[^>]*>/g,'[图]')).slice(0,160)}…</div>
      <div class="wans">你选 <span class="a">${w.mine||'—'}</span> · 正确 <span class="b">${w.a}</span></div>
    </div>
  `).join('');
}
function delWrong(i){
  const wb = getWrongBook();
  wb.splice(i,1);
  saveWrongBook(wb);
  openWrong();
  renderHomeStats();
}
function clearWrong(){
  if(!confirm('清空所有错题？')) return;
  saveWrongBook([]);
  openWrong();
  renderHomeStats();
}

renderHomeStats();
</script>
</body>
</html>
